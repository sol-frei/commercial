<label>你的昵称（可选）<input id="annotationAuthor" maxlength="30" placeholder="留空则显示为匿名"></label><label>批注颜色<select id="annotationColor"><option value="#ffe58f">黄色</option><option value="#b7eb8f">绿色</option><option value="#91d5ff">蓝色</option><option value="#d3adf7">紫色</option><option value="#ffadd2">粉色</option></select></label>
<label>批注内容<textarea id="annotationText" maxlength="1000" required></textarea></label><div class="annotation-actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary" type="submit">发布批注</button></div></form></dialog><dialog id="revisionDialog" class="annotation-dialog"><form id="revisionForm"><h3>新增文字（修订）</h3><div class="annotation-quote">将在光标处插入新文字，自动显示为紫色，仅管理员可见此功能。</div><label>新增内容<textarea id="revisionText" maxlength="500" required></textarea></label><div class="annotation-actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary" type="submit">插入</button></div></form></dialog><dialog id="lineDialog" class="annotation-dialog"><form id="lineForm"><h3>插入段落（仅管理员）</h3><label>插入位置<select id="linePosition"><option value="end">文档末尾</option><option value="before" id="linePositionBeforeOpt">所选段落之前</option><option value="after" id="linePositionAfterOpt">所选段落之后</option></select></label><label>字号<select id="lineFontSize"><option value="14">小</option><option value="16" selected>正常</option><option value="20">大</option><option value="28">标题</option></select></label><label>内容<textarea id="lineText" maxlength="2000" required></textarea></label><div class="annotation-actions"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary" type="submit">插入</button></div></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{
  const article=document.querySelector('article');
  const originalHTML=new Map();

  const selected=document.querySelector('#annotationSelection');
  const sb=window.supabase.createClient('https://iwogjwjzexcnwqyogbhe.supabase.co','sb_publishable_2FPFFSVbit2a9_0tj5eKIw_P8ech8JP');
  const showAdmin=new URLSearchParams(location.search).get('admin')==='1';

  const revisionForm=document.querySelector('#revisionForm');
  const revisionText=document.querySelector('#revisionText');
  const lineDialog=document.querySelector('#lineDialog');
  const lineForm=document.querySelector('#lineForm');
  const lineText=document.querySelector('#lineText');
  const lineFontSize=document.querySelector('#lineFontSize');
  const linePosition=document.querySelector('#linePosition');
  const linePositionBeforeOpt=document.querySelector('#linePositionBeforeOpt');
  const linePositionAfterOpt=document.querySelector('#linePositionAfterOpt');
  let pending=null,pendingInsert=null,pendingLineBlock=null,pendingRevisionId=null,me=null,isAdmin=false,notes=new Map(),replies=new Map(),revisions=new Map(),expanded=new Set();
  author.value=localStorage.getItem('annotation-author')||'';

  const admin=document.createElement('button');
  admin.type='button';
  admin.textContent='\u7ba1\u7406\u5458\u767b\u5f55';
  admin.className='annotation-add';
  Object.assign(admin.style,{display:showAdmin?'block':'none',right:'18px',left:'auto',top:'18px'});
  document.body.append(admin);

  const migrate=document.createElement('button');
  migrate.type='button';
  migrate.className='annotation-add';
  Object.assign(migrate.style,{display:'none',right:'18px',left:'auto',top:'58px',background:'#555'});
  document.body.append(migrate);

  const addWord=document.createElement('button');
  addWord.type='button';
  addWord.textContent='＋ 添加文字';
  addWord.className='annotation-add';
  document.body.append(addWord);

  const strikeButton=document.createElement('button');
  strikeButton.type='button';
  strikeButton.textContent='删除线';
  strikeButton.className='annotation-add';
  document.body.append(strikeButton);

  // 固定悬浮的"文末追加"按钮：不依赖光标/选区，随时可点。仅管理员可见。
  const addLine=document.createElement('button');
  addLine.type='button';
  addLine.textContent='＋ 插入段落';
  addLine.className='annotation-add';
  Object.assign(addLine.style,{position:'fixed',right:'18px',bottom:'18px',left:'auto',top:'auto',display:'none'});
  document.body.append(addLine);

  // 悬浮的"撤销此修订"按钮：点一下修订标记先弹出它，真要撤销再点它一次
  const undoRevision=document.createElement('button');
  undoRevision.type='button';
  undoRevision.textContent='撤销此修订';
  undoRevision.className='annotation-add';
  Object.assign(undoRevision.style,{background:'#a33'});
  document.body.append(undoRevision);

  // 悬浮的"删除线/取消删除线"按钮：只对整段插入内容（type:'line'）生效，仅管理员可见
  const strikeLineButton=document.createElement('button');
  strikeLineButton.type='button';
  strikeLineButton.className='annotation-add';
  Object.assign(strikeLineButton.style,{background:'#a33'});
  document.body.append(strikeLineButton);

  const anchorStyle=document.createElement('style');
  anchorStyle.textContent='.annotation-card.annotation-orphan{border-left-color:#999!important;background:#fafafa}.annotation-card.annotation-orphan .annotation-selected{color:#a34b00}.revision-line-block.revision-line-struck{color:#808080!important;text-decoration:line-through!important;text-decoration-thickness:1px;background:#f1f1f1;border-left-color:#8888}';
  document.head.append(anchorStyle);

  function textNodes(root){
    const result=[],walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    let node;
    while(node=walker.nextNode())result.push(node);
    return result;
  }

  function offsetWithin(root,node,pos){
    if(node&&node.nodeType===Node.TEXT_NODE){
      let total=0;
      for(const current of textNodes(root)){
        if(current===node)return total+Math.min(pos,current.data.length);
        total+=current.data.length;
      }
    }
    const range=document.createRange();
    range.selectNodeContents(root);
    range.setEnd(node,pos);
    return range.toString().length;
  }

  function globalOffset(node,pos){return offsetWithin(article,node,pos)}

  function locate(root,value){
    let total=0;
    for(const node of textNodes(root)){
      const next=total+node.data.length;
      if(value<=next)return[node,Math.max(0,value-total)];
      total=next;
    }
    return null;
  }

  function blockFor(node){
    const element=node?.nodeType===Node.TEXT_NODE?node.parentElement:node;
    return element?.closest?.('[data-comment-block-id]')||null;
  }

  function commonSuffix(a,b){
    let score=0;
    while(score<a.length&&score<b.length&&a[a.length-1-score]===b[b.length-1-score])score++;
    return score;
  }

  function commonPrefix(a,b){
    let score=0;
    while(score<a.length&&score<b.length&&a[score]===b[score])score++;
    return score;
  }

  function bestMatch(value,quote,savedStart,prefix='',suffix=''){
    if(!quote)return null;
    const start=Number(savedStart);
    if(Number.isFinite(start)&&value.slice(start,start+quote.length)===quote)return{index:start,score:100000};
    let from=0,best=null;
    while(from<=value.length){
      const index=value.indexOf(quote,from);
      if(index<0)break;
      const before=value.slice(Math.max(0,index-prefix.length),index);
      const after=value.slice(index+quote.length,index+quote.length+suffix.length);
      const proximity=Number.isFinite(start)?Math.max(0,30-Math.abs(index-start)/10):0;
      const score=commonSuffix(before,prefix)*3+commonPrefix(after,suffix)*3+proximity;
      if(!best||score>best.score)best={index,score};
      from=index+Math.max(1,quote.length);
    }
    return best;
  }

  function contextBoundaries(value,context,after){
    if(!context)return[];
    const result=[];
    let from=0;
    while(from<=value.length&&result.length<100){
      const index=value.indexOf(context,from);
      if(index<0)break;
      result.push(index+(after?context.length:0));
      from=index+Math.max(1,context.length);
    }
    return result;
  }

  function recoverEditedRange(value,note){
    const rawStart=Number(note.start_offset),rawEnd=Number(note.end_offset);
    const savedStart=Math.max(0,Math.min(value.length,Number.isFinite(rawStart)?rawStart:0));
    const savedEnd=Math.max(savedStart,Math.min(value.length,Number.isFinite(rawEnd)?rawEnd:savedStart));
    const oldLength=Math.max(1,Number.isFinite(rawEnd-rawStart)?rawEnd-rawStart:0,(note.quote||'').length);
    const prefix=note.prefix||'',suffix=note.suffix||'';
    let starts=contextBoundaries(value,prefix,true);
    let ends=contextBoundaries(value,suffix,false);
    let prefixMatched=starts.length>0,suffixMatched=ends.length>0;

    // An empty context means that side originally touched the block boundary.
    if(!prefix){starts=[0];prefixMatched=savedStart===0}
    if(!suffix){ends=[value.length];suffixMatched=true}
    if(!starts.length&&!ends.length)return null;

    const candidates=[];
    if(starts.length&&ends.length){
      for(const start of starts)for(const end of ends)if(end>start)candidates.push({start,end});
    }else if(starts.length){
      for(const start of starts){
        const end=Math.min(value.length,start+oldLength);
        if(end>start)candidates.push({start,end});
      }
    }else{
      for(const end of ends){
        const start=Math.max(0,end-oldLength);
        if(end>start)candidates.push({start,end});
      }
    }
    if(!candidates.length)return null;

    const confidence=Number(prefixMatched)+Number(suffixMatched);
    let best=null;
    for(const candidate of candidates){
      const length=candidate.end-candidate.start;
      const penalty=Math.abs(candidate.start-savedStart)*2+Math.abs(candidate.end-savedEnd)+Math.abs(length-oldLength)/4;
      const score=confidence*100000-penalty;
      if(!best||score>best.score)best={...candidate,score,confidence};
    }
    return best;
  }

  function boundaryFromContext(value,saved,prefix,suffix,isStart){
    const numeric=Math.max(0,Math.min(value.length,Number(saved)||0));
    if(isStart){
      if(prefix&&value.slice(Math.max(0,numeric-prefix.length),numeric)===prefix)return numeric;
      if(prefix){const index=value.lastIndexOf(prefix);if(index>=0)return index+prefix.length}
    }else{
      if(suffix&&value.slice(numeric,numeric+suffix.length)===suffix)return numeric;
      if(suffix){const index=value.indexOf(suffix);if(index>=0)return index}
    }
    return numeric;
  }

  function resolveMultiBlock(note){
    const ids=String(note.block_id||'').split('|');
    if(ids.length<2)return null;
    const blocks=[...article.querySelectorAll('[data-comment-block-id]')];
    const startBlock=article.querySelector('[data-comment-block-id="'+CSS.escape(ids[0])+'"]');
    const endBlock=article.querySelector('[data-comment-block-id="'+CSS.escape(ids[1])+'"]');
    const startIndex=blocks.indexOf(startBlock),endIndex=blocks.indexOf(endBlock);
    if(startIndex<0||endIndex<startIndex)return null;
    const startValue=startBlock.textContent||'',endValue=endBlock.textContent||'';
    const startLength=Number(ids[2])||0,endLength=Number(ids[3])||0;
    let start=boundaryFromContext(startValue,note.start_offset,note.prefix||'','',true);
    let end=boundaryFromContext(endValue,note.end_offset,'',note.suffix||'',false);
    const firstPart=startLength?(note.quote||'').slice(0,startLength):'';
    const lastPart=endLength?(note.quote||'').slice(-endLength):'';
    if(firstPart&&startValue.slice(start,start+firstPart.length)!==firstPart){
      const match=bestMatch(startValue,firstPart,start,note.prefix||'','');
      if(match)start=match.index;
    }
    if(lastPart&&endValue.slice(Math.max(0,end-lastPart.length),end)!==lastPart){
      const match=bestMatch(endValue,lastPart,Math.max(0,end-lastPart.length),'',note.suffix||'');
      if(match)end=match.index+lastPart.length;
    }
    const selectedBlocks=blocks.slice(startIndex,endIndex+1);
    const parts=selectedBlocks.map((block,index)=>({
      root:block,
      start:index===0?start:0,
      end:index===selectedBlocks.length-1?end:(block.textContent||'').length
    })).filter(part=>part.end>part.start);
    const currentQuote=parts.map(part=>(part.root.textContent||'').slice(part.start,part.end)).join('');
    return parts.length?{parts,currentQuote,recovered:currentQuote!==(note.quote||'')}:null;
  }

  function resolveAnchor(note){
    if(Number(note.anchor_version)>=3)return resolveMultiBlock(note);
    if(Number(note.anchor_version)>=2&&note.block_id){
      const selector='[data-comment-block-id="'+CSS.escape(note.block_id)+'"]';
      const original=article.querySelector(selector);
      if(original){
        const value=original.textContent||'';
        const exact=bestMatch(value,note.quote||'',note.start_offset,note.prefix||'',note.suffix||'');
        if(exact?.score>=100000){
          const end=exact.index+(note.quote||'').length;
          return{root:original,start:exact.index,end,score:exact.score+1000,currentQuote:value.slice(exact.index,end),recovered:false};
        }
        const recovered=recoverEditedRange(value,note);
        if(recovered){
          const currentQuote=value.slice(recovered.start,recovered.end);
          return{root:original,start:recovered.start,end:recovered.end,score:recovered.score+1000,currentQuote,recovered:currentQuote!==(note.quote||'')};
        }
      }
      const candidates=[];
      for(const block of article.querySelectorAll('[data-comment-block-id]'))candidates.push(block);
      let best=null;
      for(const block of candidates){
        const value=block.textContent||'';
        const match=bestMatch(value,note.quote||'',note.start_offset,note.prefix||'',note.suffix||'');
        if(!match)continue;
        const score=match.score+(block===original?1000:0);
        const end=match.index+(note.quote||'').length;
        if(!best||score>best.score)best={root:block,start:match.index,end,score,currentQuote:value.slice(match.index,end),recovered:false};
        if(score>=101000)break;
      }
      return best;
    }
    const start=Number(note.start_offset),end=Number(note.end_offset);
    if(Number.isFinite(start)&&Number.isFinite(end)&&end>start)return{root:article,start,end,score:0};
    return null;
  }

  function clearMarks(){
    const old=[...article.querySelectorAll('.annotation-mark')];
    for(let index=old.length-1;index>=0;index--)old[index].replaceWith(...old[index].childNodes);
    article.normalize();
  }

  function wrapOffsets(root,start,end,id,note){
    const segments=[];
    let position=0;
    for(const node of textNodes(root)){
      const from=Math.max(0,start-position);
      const to=Math.min(node.data.length,end-position);
      if(from<to)segments.push([node,from,to]);
      position+=node.data.length;
    }
    for(let index=segments.length-1;index>=0;index--){
      let[node,from,to]=segments[index],part=node;
      if(to<part.data.length)part.splitText(to);
      if(from>0)part=part.splitText(from);
      const mark=document.createElement('mark');
      mark.className='annotation-mark';
      mark.dataset.noteId=id;
      mark.style.backgroundColor=note.color||'#ffe58f';
      mark.title=(note.author_name||'\u533f\u540d')+'\uff1a'+(note.body||note.quote||'');
      part.replaceWith(mark);
      mark.append(part);
    }
    return segments.length>0;
  }

  function paint(){
    clearMarks();
    const ordered=[...notes.entries()].sort((a,b)=>Number(b[1].start_offset)-Number(a[1].start_offset));
    for(const[id,note]of ordered){
      try{
        const anchor=resolveAnchor(note);
        const label=list.querySelector('.annotation-card[data-note-id="'+CSS.escape(id)+'"] .annotation-selected');
        if(label&&anchor?.currentQuote)label.textContent=anchor.currentQuote;
        if(anchor?.parts){
          for(const part of anchor.parts)wrapOffsets(part.root,part.start,part.end,id,note);
        }else if(anchor){
          wrapOffsets(anchor.root,anchor.start,anchor.end,id,note);
        }
      }catch(error){console.warn('annotation anchor failed',id,error)}
    }
  }

  function blockIdsFor(note){
    if(Number(note.anchor_version)>=3){
      const ids=String(note.block_id||'').split('|');
      return ids.slice(0,2).filter(Boolean);
    }
    return note.block_id?[note.block_id]:[];
  }

  function wrapRange(root,start,end,makeWrapper){
    const segments=[];
    let position=0;
    for(const node of textNodes(root)){
      const from=Math.max(0,start-position);
      const to=Math.min(node.data.length,end-position);
      if(from<to)segments.push([node,from,to]);
      position+=node.data.length;
    }
    for(let index=segments.length-1;index>=0;index--){
      let[node,from,to]=segments[index],part=node;
      if(to<part.data.length)part.splitText(to);
      if(from>0)part=part.splitText(from);
      const wrapper=makeWrapper();
      part.replaceWith(wrapper);
      wrapper.append(part);
    }
    return segments.length>0;
  }

  function insertAt(root,offset,node){
    const found=locate(root,offset);
    if(!found){root.append(node);return}
    const[textNode,localOffset]=found;
    if(localOffset<=0){textNode.before(node);return}
    if(localOffset>=textNode.data.length){textNode.after(node);return}
    textNode.splitText(localOffset);
    textNode.after(node);
  }

  function locateInsertion(note){
    const block=article.querySelector('[data-comment-block-id="'+CSS.escape(note.block_id)+'"]');
    if(!block)return null;
    const value=block.textContent||'';
    const saved=Math.max(0,Math.min(value.length,Number(note.start_offset)||0));
    const prefix=note.prefix||'',suffix=note.suffix||'';
    if((!prefix||value.slice(Math.max(0,saved-prefix.length),saved)===prefix)&&(!suffix||value.slice(saved,saved+suffix.length)===suffix)){
      return{root:block,offset:saved};
    }
    if(prefix){
      let from=0;
      while(true){
        const index=value.indexOf(prefix,from);
        if(index<0)break;
        const candidate=index+prefix.length;
        if(!suffix||value.slice(candidate,candidate+suffix.length)===suffix)return{root:block,offset:candidate};
        from=index+1;
      }
    }
    if(suffix){
      const index=value.indexOf(suffix);
      if(index>=0)return{root:block,offset:index};
    }
    return{root:block,offset:saved};
  }

  function paintRevisions(){
    article.querySelectorAll('[data-comment-block-id]').forEach(block=>{
      const id=block.dataset.commentBlockId;
      if(originalHTML.has(id)&&block.querySelector('[data-revision-id]'))block.innerHTML=originalHTML.get(id);
    });
    for(const note of revisions.values()){
      for(const id of blockIdsFor(note)){
        const block=article.querySelector('[data-comment-block-id="'+CSS.escape(id)+'"]');
        if(block&&originalHTML.has(id))block.innerHTML=originalHTML.get(id);
      }
    }
    const deletions=[...revisions.values()].filter(note=>note.type==='deleted').sort((a,b)=>Number(b.start_offset)-Number(a.start_offset));
    for(const note of deletions){
      try{
        const anchor=resolveAnchor(note);
        if(!anchor)continue;
        const makeWrapper=()=>{
          const span=document.createElement('span');
          span.className='revision-deleted';
          span.dataset.revisionId=note.id;
          span.title='已由管理员标记为废弃';
          return span;
        };
        if(anchor.parts){for(const part of anchor.parts)wrapRange(part.root,part.start,part.end,makeWrapper)}
        else wrapRange(anchor.root,anchor.start,anchor.end,makeWrapper);
      }catch(error){console.warn('revision(deleted) anchor failed',note.id,error)}
    }
    const insertions=[...revisions.values()].filter(note=>note.type==='added').sort((a,b)=>Number(b.start_offset)-Number(a.start_offset));
    for(const note of insertions){
      try{
        const location=locateInsertion(note);
        if(!location)continue;
        const span=document.createElement('span');
        span.className='revision-added'+(note.struck?' revision-struck':'');
        span.dataset.revisionId=note.id;
        span.dataset.commentBlockId='revision-'+note.id;
        span.title='管理员新增文字'+(note.struck?'（已标记删除线）':'');
        span.textContent=note.text||'';
        insertAt(location.root,location.offset,span);
      }catch(error){console.warn('revision(added) anchor failed',note.id,error)}
    }

    // 插入的整段内容（type:'line'）：可以挂在文档末尾，也可以挂在某个段落的前面/后面。
    // 统一先清空旧的 DOM 节点，再按 created_at 顺序重建，随时保留删除线状态（struck）。
    article.querySelectorAll('.revision-line-block').forEach(node=>node.remove());
    let endContainer=article.querySelector('.revision-end-container');
    if(!endContainer){
      endContainer=document.createElement('div');
      endContainer.className='revision-end-container';
      article.append(endContainer);
    }else{
      endContainer.innerHTML='';
    }
    const lines=[...revisions.values()]
      .filter(note=>note.type==='line')
      .sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    for(const note of lines){
      const div=document.createElement('div');
      div.className='revision-line-block'+(note.struck?' revision-line-struck':'');
      div.dataset.revisionId=note.id;
      div.dataset.commentBlockId='revision-'+note.id;
      div.style.fontSize=(note.font_size||16)+'px';
      div.title=(note.author_name||'\u533f\u540d')+' \u65b0\u589e\u7684\u5185\u5bb9'+(note.struck?'\uff08\u5df2\u6807\u8bb0\u5220\u9664\u7ebf\uff09':'');
      div.textContent=note.text||'';
      const position=note.position||'end';
      const targetBlock=note.block_id&&note.block_id!=='DOC_END'?article.querySelector('[data-comment-block-id="'+CSS.escape(note.block_id)+'"]'):null;
      if(targetBlock&&position==='before'){
        targetBlock.before(div);
      }else if(targetBlock&&position==='after'){
        targetBlock.after(div);
      }else{
        endContainer.append(div);
      }
    }
  }

  function layout(){
    const cards=[...list.querySelectorAll('.annotation-card')];
    const anchored=[],orphaned=[];
    const isMobile=window.matchMedia('(max-width: 720px)').matches;

    for(const card of cards){
      const marker=article.querySelector('[data-note-id="'+CSS.escape(card.dataset.noteId)+'"]');
      if(marker)anchored.push({card,marker});else orphaned.push(card);
    }

    anchored.sort((a,b)=>a.marker.getBoundingClientRect().top-b.marker.getBoundingClientRect().top);

    // 批注卡片始终贴靠在页面右侧的批注栏内——这个栏的宽度已经按屏幕宽度做了
    // 响应式收窄（min(..., 100vw - 间距)），因此不会超出屏幕、也不会挡住内容。
    // top 则始终跟着对应句子在文档中的位置走，这样卡片仍然"挨着"它标注的那句话，
    // 而不是简单按顺序堆叠，也不会都挤在屏幕正中间。
    let bottom=article.getBoundingClientRect().top+scrollY;
    for(const item of anchored){
      item.card.classList.remove('annotation-orphan');
      const top=Math.max(item.marker.getBoundingClientRect().top+scrollY,bottom);
      item.card.style.top=top+'px';
      bottom=top+item.card.offsetHeight+10;
    }

    bottom=Math.max(bottom,article.getBoundingClientRect().bottom+scrollY+12);
    for(const card of orphaned){
      card.classList.add('annotation-orphan');
      const note=notes.get(card.dataset.noteId);
      const label=card.querySelector('.annotation-selected');
      if(label)label.textContent='⚠ 原文已修改：'+(note?.quote||'');
      card.style.top=bottom+'px';
      bottom+=card.offsetHeight+10;
    }

    if(isMobile)enableMobileAnnotationScroll();
  }

  // 手机端：批注框内部独立滚动，手指在批注框上滑动时不让正文跟着滚。
  // 使用 JS 接管 touchmove，可避免某些手机浏览器在 fixed + overflow-y 场景下把手势交给 body。
  function enableMobileAnnotationScroll(){
    if(!window.matchMedia('(max-width: 720px)').matches)return;
    list.querySelectorAll('.annotation-card:not(.is-collapsed)').forEach(card=>{
      if(card.dataset.touchScrollBound==='1')return;
      card.dataset.touchScrollBound='1';
      let lastY=0;
      let dragging=false;
      card.addEventListener('touchstart',event=>{
        if(event.touches.length!==1)return;
        lastY=event.touches[0].clientY;
        dragging=true;
      },{passive:true});
      card.addEventListener('touchmove',event=>{
        if(!dragging||event.touches.length!==1)return;
        const y=event.touches[0].clientY;
        const dy=lastY-y;
        lastY=y;
        if(card.scrollHeight>card.clientHeight+1){
          card.scrollTop+=dy;
          event.preventDefault();
        }else{
          // 批注内容不足一屏时也拦住手势，避免正文被误滚动。
          event.preventDefault();
        }
      },{passive:false});
      card.addEventListener('touchend',()=>{dragging=false},{passive:true});
      card.addEventListener('touchcancel',()=>{dragging=false},{passive:true});
    });
  }

  function button(label,handler){
    const result=document.createElement('button');
    result.type='button';result.textContent=label;result.onclick=handler;
    return result;
  }

  function currentAuthor(){
    const value=author.value.trim();
    if(value)localStorage.setItem('annotation-author',value);
    return value||'\u533f\u540d';
  }

  function render(){
    const ordered=[...notes.entries()].sort((a,b)=>new Date(a[1].created_at)-new Date(b[1].created_at));
    count.textContent=ordered.length;
    list.innerHTML='';
    for(const[id,note]of ordered){
      const noteReplies=[...replies.values()].filter(reply=>reply.comment_id===id).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
      const card=document.createElement('div');
      card.className='annotation-card'+(expanded.has(id)?'':' is-collapsed');
      card.dataset.noteId=id;
      card.style.borderLeftColor=note.color||'#e5bd45';
      card.innerHTML='<div class="annotation-quote"><span class="annotation-selected"></span><span class="annotation-preview"></span></div><div class="annotation-body"></div><div class="annotation-meta"></div><div class="annotation-replies"></div><form class="annotation-reply"><input maxlength="500" placeholder="\u56de\u590d\u2026"><button>\u56de\u590d</button></form>';
      const quote=card.children[0];
      quote.dataset.replyCount=noteReplies.length;
      quote.querySelector('.annotation-selected').textContent=note.quote||'';
      quote.querySelector('.annotation-preview').textContent=note.body||'\uff08\u65e7\u6279\u6ce8\u672a\u4fdd\u5b58\u5185\u5bb9\uff09';
      quote.onclick=()=>{
        card.classList.toggle('is-collapsed');
        card.classList.contains('is-collapsed')?expanded.delete(id):expanded.add(id);
        requestAnimationFrame(layout);
      };
      card.children[1].textContent=note.body||'\uff08\u65e7\u6279\u6ce8\u672a\u4fdd\u5b58\u5185\u5bb9\uff09';
      card.children[2].textContent=(note.author_name||'\u533f\u540d')+' \u00b7 '+new Date(note.created_at).toLocaleString();

      for(const reply of noteReplies){
        const item=document.createElement('div');
        item.className='annotation-reply-item'+(reply.status==='hidden'?' is-hidden':'');
        const content=document.createElement('div');
        content.className='annotation-reply-content';
        content.textContent=(reply.author_name||'\u533f\u540d')+'\uff1a'+reply.text+(reply.status==='hidden'?'\uff08\u5df2\u9690\u85cf\uff09':'')+' \u00b7 '+new Date(reply.created_at).toLocaleString();
        item.append(content);
        if(isAdmin||reply.author_id===me){
          const controls=document.createElement('div');
          controls.className='annotation-reply-admin';
          if(isAdmin)controls.append(button(reply.status==='hidden'?'\u6062\u590d\u56de\u590d':'\u9690\u85cf\u56de\u590d',async()=>{
            const result=await sb.from('replies').update({status:reply.status==='hidden'?'visible':'hidden'}).eq('id',reply.id);
            result.error?alert('\u64cd\u4f5c\u5931\u8d25\uff1a'+result.error.message):load(true);
          }));
          controls.append(button('\u5220\u9664\u56de\u590d',async()=>{
            if(!confirm('\u786e\u5b9a\u6c38\u4e45\u5220\u9664\u8fd9\u6761\u56de\u590d\uff1f'))return;
            const result=await sb.from('replies').delete().eq('id',reply.id);
            result.error?alert('\u5220\u9664\u5931\u8d25\uff1a'+result.error.message):load(true);
          }));
          item.append(controls);
        }
        card.children[3].append(item);
      }

      if(isAdmin||note.author_id===me){
        if(isAdmin)card.children[2].append(' \u00b7 ',button(note.status==='hidden'?'\u6062\u590d':'\u9690\u85cf',async()=>{
          const result=await sb.from('comments').update({status:note.status==='hidden'?'visible':'hidden'}).eq('id',id);
          result.error?alert('\u64cd\u4f5c\u5931\u8d25\uff1a'+result.error.message):load(true);
        }));
        card.children[2].append(' \u00b7 ',button('\u5220\u9664',async()=>{
          if(!confirm('\u786e\u5b9a\u6c38\u4e45\u5220\u9664\u8fd9\u6761\u6279\u6ce8\u53ca\u5176\u56de\u590d\uff1f'))return;
          const result=await sb.from('comments').delete().eq('id',id);
          result.error?alert('\u5220\u9664\u5931\u8d25\uff1a'+result.error.message):load(true);
        }));
      }

      card.querySelector('form').onsubmit=async event=>{
        event.preventDefault();
        const input=event.currentTarget.querySelector('input'),value=input.value.trim();
        if(!value)return;
        const result=await sb.from('replies').insert({comment_id:id,author_name:currentAuthor(),text:value});
        if(result.error){alert('\u56de\u590d\u5931\u8d25\uff1a'+result.error.message);return}
        input.value='';load(true);
      };
      list.append(card);
    }
    paintRevisions();paint();layout();updateMigrationButton();updateAdminButtons();
  }

  function updateAdminButtons(){
    // "＋ 插入段落" 仅管理员可见；同步刷新对话框里"所选段落之前/之后"选项是否可用
    addLine.style.display=isAdmin?'block':'none';
    const hasTarget=Boolean(isAdmin&&pendingLineBlock);
    if(linePositionBeforeOpt)linePositionBeforeOpt.disabled=!hasTarget;
    if(linePositionAfterOpt)linePositionAfterOpt.disabled=!hasTarget;
  }

  function isEditing(){
    const active=document.activeElement;
    return dialog.open||revisionDialog.open||lineDialog.open||Boolean(active?.closest?.('.annotation-reply')&&active.value);
  }

  async function load(force=false){
    if(!force&&isEditing())return;
    let query=sb.from('comments').select('*').eq('article_id',article.id).order('created_at');
    if(!isAdmin)query=query.eq('status','visible');
    const commentsResult=await query;
    if(commentsResult.error){console.error(commentsResult.error);return}
    const repliesResult=await sb.from('replies').select('*').order('created_at');
    const revisionsResult=await sb.from('revisions').select('*').eq('article_id',article.id);
    if(revisionsResult.error)console.error(revisionsResult.error);
    if(!force&&isEditing())return;
    notes=new Map((commentsResult.data||[]).map(note=>[note.id,note]));
    replies=new Map((repliesResult.data||[]).filter(reply=>notes.has(reply.comment_id)&&(isAdmin||reply.status==='visible')).map(reply=>[reply.id,reply]));
    revisions=new Map((revisionsResult.data||[]).map(note=>[note.id,note]));
    render();
  }

  function updateMigrationButton(){
    const total=[...notes.values()].filter(note=>Number(note.anchor_version||1)<2).length;
    migrate.textContent='\u8fc1\u79fb\u65e7\u6279\u6ce8 ('+total+')';
    migrate.style.display=isAdmin&&showAdmin&&total?'block':'none';
  }

  async function migrateLegacy(){
    if(!isAdmin)return;
    const legacy=[...notes.values()].filter(note=>Number(note.anchor_version||1)<2);
    if(!legacy.length){alert('\u6ca1\u6709\u9700\u8981\u8fc1\u79fb\u7684\u65e7\u6279\u6ce8\u3002');return}
    if(!confirm('\u5c06\u5f00\u59cb\u8fc1\u79fb '+legacy.length+' \u6761\u65e7\u6279\u6ce8\uff0c\u8fc1\u79fb\u524d\u8bf7\u786e\u8ba4\u5df2\u5907\u4efd\u6570\u636e\u3002\u662f\u5426\u7ee7\u7eed\uff1f'))return;
    clearMarks();
    let success=0,failed=0;
    for(const note of legacy){
      const boundary=locate(article,Number(note.start_offset));
      const block=boundary?blockFor(boundary[0]):null;
      const quote=note.quote||'';
      if(!block||!quote){failed++;continue}
      const approximate=offsetWithin(block,boundary[0],boundary[1]);
      const match=bestMatch(block.textContent||'',quote,approximate,'','');
      if(!match){failed++;continue}
      const value=block.textContent||'',start=match.index,end=start+quote.length;
      const result=await sb.from('comments').update({
        anchor_version:2,
        block_id:block.dataset.commentBlockId,
        start_offset:start,
        end_offset:end,
        prefix:value.slice(Math.max(0,start-30),start),
        suffix:value.slice(end,end+30)
      }).eq('id',note.id);
      result.error?failed++:success++;
    }
    alert('\u8fc1\u79fb\u5b8c\u6210\u3002\u6210\u529f\uff1a'+success+' \u6761\uff1b\u9700\u4eba\u5de5\u68c0\u67e5\uff1a'+failed+' \u6761\u3002');
    await load(true);
  }

  async function session(){
    let current=(await sb.auth.getSession()).data.session;
    if(!current)current=(await sb.auth.signInAnonymously()).data.session;
    me=current?.user?.id;
    const profile=me?await sb.from('profiles').select('role').eq('id',me).maybeSingle():null;
    isAdmin=profile?.data?.role==='admin';
    document.body.classList.toggle('revision-admin',isAdmin);
    admin.textContent=isAdmin?'\u7ba1\u7406\u5458\u5df2\u767b\u5f55':'\u7ba1\u7406\u5458\u767b\u5f55';
    await load(true);
  }

  document.addEventListener('selectionchange',()=>{
    const selection=getSelection();
    if(!selection.rangeCount||!article.contains(selection.anchorNode)||!article.contains(selection.focusNode)){add.style.display='none';addWord.style.display='none';strikeButton.style.display='none';return}
    const range=selection.getRangeAt(0);
    // 光标/选区落在某条修订标记（紫色新增字/删除线/整段插入）内部时，仍然允许添加共享批注；
    // 只有管理员的“新增文字”按钮需要隐藏，避免与修订操作按钮重叠。
    const inRevision=Boolean((selection.anchorNode&&(selection.anchorNode.nodeType===Node.TEXT_NODE?selection.anchorNode.parentElement:selection.anchorNode)?.closest?.('[data-revision-id]')));
    if(selection.isCollapsed){
      add.style.display='none';strikeButton.style.display='none';pending=null;
      if(!isAdmin||inRevision){addWord.style.display='none';pendingInsert=null;return}
      const caretBlock=blockFor(range.startContainer);
      if(!caretBlock){addWord.style.display='none';pendingInsert=null;return}
      const caretOffset=offsetWithin(caretBlock,range.startContainer,range.startOffset);
      const caretValue=caretBlock.textContent||'';
      pendingInsert={block_id:caretBlock.dataset.commentBlockId,offset:caretOffset,prefix:caretValue.slice(Math.max(0,caretOffset-30),caretOffset),suffix:caretValue.slice(caretOffset,caretOffset+30)};
      pendingLineBlock=caretBlock.dataset.commentBlockId;
      updateAdminButtons();
      const caretBox=range.getBoundingClientRect();
      addWord.style.left=Math.max(8,caretBox.left-10)+'px';
      addWord.style.top=Math.max(8,caretBox.top-40)+'px';
      addWord.style.display='block';
      undoRevision.style.display='none';strikeLineButton.style.display='none';pendingRevisionId=null;
      return;
    }
    addWord.style.display='none';pendingInsert=null;
    const raw=selection.toString();
    if(!raw.trim()){add.style.display='none';strikeButton.style.display='none';pending=null;return}
    const globalStart=globalOffset(range.startContainer,range.startOffset);
    const globalEnd=globalOffset(range.endContainer,range.endOffset);
    const startBlock=blockFor(range.startContainer),endBlock=blockFor(range.endContainer);
    pending={anchor_version:1,block_id:article.id,start:globalStart,end:globalEnd,quote:raw.trim(),prefix:'',suffix:''};
    if(startBlock&&startBlock===endBlock){
      const start=offsetWithin(startBlock,range.startContainer,range.startOffset);
      const end=offsetWithin(startBlock,range.endContainer,range.endOffset);
      const value=startBlock.textContent||'';
      const quote=value.slice(start,end);
      if(quote)pending={anchor_version:2,block_id:startBlock.dataset.commentBlockId,start,end,quote,prefix:value.slice(Math.max(0,start-30),start),suffix:value.slice(end,end+30)};
    }else if(startBlock&&endBlock){
      const blocks=[...article.querySelectorAll('[data-comment-block-id]')];
      const startIndex=blocks.indexOf(startBlock),endIndex=blocks.indexOf(endBlock);
      if(startIndex>=0&&endIndex>startIndex){
        const start=offsetWithin(startBlock,range.startContainer,range.startOffset);
        const end=offsetWithin(endBlock,range.endContainer,range.endOffset);
        const selectedBlocks=blocks.slice(startIndex,endIndex+1);
        const quote=selectedBlocks.map((block,index)=>{
          const value=block.textContent||'';
          if(index===0)return value.slice(start);
          if(index===selectedBlocks.length-1)return value.slice(0,end);
          return value;
        }).join('');
        const startLength=(startBlock.textContent||'').length-start,endLength=end;
        if(quote)pending={anchor_version:3,block_id:[startBlock.dataset.commentBlockId,endBlock.dataset.commentBlockId,startLength,endLength].join('|'),start,end,quote,prefix:(startBlock.textContent||'').slice(Math.max(0,start-30),start),suffix:(endBlock.textContent||'').slice(end,end+30)};
      }
    }
    const box=range.getBoundingClientRect();
    add.style.left=Math.max(8,box.left+box.width/2-55)+'px';
    add.style.top=Math.max(8,box.top-46)+'px';
    add.style.display='block';
    if(isAdmin&&pending){
      strikeButton.style.left=Math.max(8,box.left+box.width/2+65)+'px';
      strikeButton.style.top=add.style.top;
      strikeButton.style.display='block';
    }else{
      strikeButton.style.display='none';
    }
    undoRevision.style.display='none';strikeLineButton.style.display='none';pendingRevisionId=null;
  });

  add.onclick=()=>{
    if(!pending)return;
    selected.textContent='\u201c'+pending.quote+'\u201d';
    dialog.showModal();add.style.display='none';
  };

  addWord.onclick=()=>{
    if(!pendingInsert)return;
    revisionText.value='';
    revisionDialog.showModal();
    addWord.style.display='none';
  };

  revisionForm.onsubmit=async event=>{
    event.preventDefault();
    if(!pendingInsert)return;
    const value=revisionText.value.trim();
    if(!value)return;
    const result=await sb.from('revisions').insert({
      article_id:article.id,
      type:'added',
      anchor_version:2,
      block_id:pendingInsert.block_id,
      start_offset:pendingInsert.offset,
      end_offset:pendingInsert.offset,
      text:value,
      prefix:pendingInsert.prefix,
      suffix:pendingInsert.suffix,
      struck:false
    });
    if(result.error){alert('新增失败：'+result.error.message);return}
    revisionDialog.close();pendingInsert=null;getSelection().removeAllRanges();load(true);
  };

  strikeButton.onclick=async()=>{
    if(!pending||!isAdmin)return;
    strikeButton.style.display='none';
    const revisionPayload=pending;
    const result=await sb.from('revisions').insert({
      article_id:article.id,
      type:'deleted',
      anchor_version:revisionPayload.anchor_version,
      block_id:revisionPayload.block_id,
      start_offset:revisionPayload.start,
      end_offset:revisionPayload.end,
      quote:revisionPayload.quote,
      prefix:revisionPayload.prefix,
      suffix:revisionPayload.suffix
    });
    if(result.error){alert('标记失败：'+result.error.message);return}
    pending=null;getSelection().removeAllRanges();add.style.display='none';load(true);
  };

  // 固定的"插入段落"按钮：仅管理员可见，直接弹窗，不依赖光标/选区。
  // 若最近光标停留在某个段落中，对话框里的"所选段落之前/之后"选项会被启用。
  addLine.onclick=()=>{
    if(!isAdmin)return;
    lineText.value='';
    linePosition.value='end';
    const hasTarget=Boolean(pendingLineBlock);
    linePositionBeforeOpt.disabled=!hasTarget;
    linePositionAfterOpt.disabled=!hasTarget;
    lineDialog.showModal();
  };

  lineForm.onsubmit=async event=>{
    event.preventDefault();
    if(!isAdmin)return;
    const value=lineText.value.trim();
    if(!value)return;
    const fontSize=Number(lineFontSize.value);
    const position=linePosition.value;
    const useTarget=(position==='before'||position==='after')&&pendingLineBlock;
    const result=await sb.from('revisions').insert({
      article_id:article.id,
      type:'line',
      block_id:useTarget?pendingLineBlock:'DOC_END',
      position:useTarget?position:'end',
      text:value,
      font_size:fontSize,
      struck:false,
      author_name:currentAuthor()
    });
    if(result.error){alert('新增失败：'+result.error.message);return}
    lineDialog.close();load(true);
  };

  form.onsubmit=async event=>{
    event.preventDefault();
    if(!pending)return;
    const value=text.value.trim();
    if(!value)return;
    const result=await sb.from('comments').insert({
      article_id:article.id,
      anchor_version:pending.anchor_version,
      block_id:pending.block_id,
      start_offset:pending.start,
      end_offset:pending.end,
      quote:pending.quote,
      body:value,
      prefix:pending.prefix,
      suffix:pending.suffix,
      color:color.value,
      author_name:currentAuthor()
    });
    if(result.error){alert('\u53d1\u5e03\u5931\u8d25\uff1a'+result.error.message);return}
    dialog.close();text.value='';pending=null;getSelection().removeAllRanges();load(true);
  };

  article.addEventListener('click',event=>{
    const mark=event.target.closest('.annotation-mark');
    if(!mark)return;

    // 一个文字位置可能同时叠加多条批注。paint() 会把重叠批注嵌套起来，
    // 因此从当前 mark 向上遍历所有 annotation-mark，就能拿到点击位置对应的全部批注。
    const ids=[];
    let node=mark;
    while(node&&node!==article){
      if(node.classList?.contains('annotation-mark')&&node.dataset.noteId&&!ids.includes(node.dataset.noteId)){
        ids.push(node.dataset.noteId);
      }
      node=node.parentElement;
    }

    for(const id of ids){
      const card=list.querySelector('[data-note-id="'+CSS.escape(id)+'"]');
      if(card){
        expanded.add(id);
        card.classList.remove('is-collapsed');
      }
    }
    if(ids.length)requestAnimationFrame(layout);
  });

  // 捕获阶段：任何一次新的点击/轻触，先把上一次残留的"撤销此修订"/"删除线切换"按钮收起来
  // （捕获阶段比下面 article 上的冒泡监听器先执行，顺序很关键，不能颠倒）
  document.addEventListener('click',event=>{
    if(event.target===undoRevision||event.target===strikeLineButton)return; // 交给它们自己的 onclick 处理，这里不要提前收起
    undoRevision.style.display='none';strikeLineButton.style.display='none';pendingRevisionId=null;
  },true);

  // 冒泡阶段：判断这次点的是不是修订标记（紫色新增字/删除线/整段插入内容），如果是就重新弹出撤销/删除线按钮
  // 管理员可以撤销、切换任何修订的删除线；普通用户只能撤销自己新增的"整段插入"内容（type:'line'）
  article.addEventListener('click',event=>{
    const revisionEl=event.target.closest('[data-revision-id]');
    if(!revisionEl)return;
    // 命中修订标记时，"添加文字"按钮没有意义，先收起，避免和下面即将显示的按钮重叠
    addWord.style.display='none';pendingInsert=null;
    const note=revisions.get(revisionEl.dataset.revisionId);
    const canUndo=isAdmin||(note?.type==='line'&&note?.author_id===me);
    if(!canUndo){undoRevision.style.display='none';strikeLineButton.style.display='none';pendingRevisionId=null;return}
    // 不调用 confirm()，也不 preventDefault —— 让这次点击照常触发 selectionchange，
    // 定位光标、继续打字这件事完全不受影响
    pendingRevisionId=revisionEl.dataset.revisionId;
    const box=revisionEl.getBoundingClientRect();
    // "撤销此修订"固定放在标记正上方；如果这条修订是整段插入内容（type:'line'）且当前是管理员，
    // 再额外显示一个"删除线切换"按钮，放在撤销按钮的右侧，避免两者叠在同一个位置。
    undoRevision.style.left=Math.max(8,box.left)+'px';
    undoRevision.style.top=Math.max(8,box.top-42)+'px';
    undoRevision.style.display='block';
    if(isAdmin&&(note?.type==='line'||note?.type==='added')){
      strikeLineButton.textContent=note.struck?'取消删除线':'删除线';
      const undoWidth=undoRevision.offsetWidth||100;
      strikeLineButton.style.left=Math.max(8,box.left+undoWidth+10)+'px';
      strikeLineButton.style.top=undoRevision.style.top;
      strikeLineButton.style.display='block';
    }else{
      strikeLineButton.style.display='none';
    }
  });

  undoRevision.onclick=async()=>{
    if(!pendingRevisionId)return;
    const id=pendingRevisionId;
    undoRevision.style.display='none';strikeLineButton.style.display='none';pendingRevisionId=null;
    if(!confirm('撤销这条修订标记吗？'))return;
    const result=await sb.from('revisions').delete().eq('id',id);
    result.error?alert('撤销失败：'+result.error.message):load(true);
  };

  strikeLineButton.onclick=async()=>{
    if(!pendingRevisionId||!isAdmin)return;
    const id=pendingRevisionId,note=revisions.get(id);
    if(!note||(note.type!=='line'&&note.type!=='added'))return;
    strikeLineButton.style.display='none';undoRevision.style.display='none';pendingRevisionId=null;
    const result=await sb.from('revisions').update({struck:!note.struck}).eq('id',id);
    result.error?alert('操作失败：'+result.error.message):load(true);
  };

  admin.onclick=async()=>{
    const email=prompt('\u8f93\u5165\u7ba1\u7406\u5458\u90ae\u7bb1\uff0c\u7cfb\u7edf\u5c06\u53d1\u9001\u767b\u5f55\u94fe\u63a5\uff1a');
    if(!email)return;
    const result=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});
    alert(result.error?'\u53d1\u9001\u5931\u8d25\uff1a'+result.error.message:'\u767b\u5f55\u94fe\u63a5\u5df2\u53d1\u9001\u5230\u90ae\u7bb1');
  };
  migrate.onclick=migrateLegacy;

  document.addEventListener('click',event=>{
    if(event.target.closest?.('.annotation-card,.annotation-mark,#annotationAdd,#annotationDialog')||event.target===admin||event.target===migrate)return;
    if(!expanded.size)return;
    expanded.clear();list.querySelectorAll('.annotation-card').forEach(card=>card.classList.add('is-collapsed'));requestAnimationFrame(layout);
  });

  addEventListener('resize',layout);
  session();
  setInterval(()=>load(false),10000);
})();
</script>
<script>
(()=>{if(new URLSearchParams(location.search).get('admin')==='1')return;const buttons=[...document.querySelectorAll('button')];const adminButton=buttons.find(button=>button.textContent.trim()==='管理员登录'||button.textContent.trim()==='管理员已登录');if(adminButton)adminButton.style.display='none'})();
</script>
<style>.annotation-dialog select{width:100%;margin-top:5px;padding:8px;border:1px solid #ccc;border-radius:8px}.annotation-replies{margin-top:8px;border-top:1px solid #eee;padding-top:5px}.annotation-reply-item{font-size:12px;padding:5px 0;border-bottom:1px solid #eee}.annotation-reply-item.is-hidden{color:#999;background:#f5f5f5;border-radius:5px;padding:4px 6px}.annotation-reply-admin{display:flex!important;align-items:center;gap:8px;margin-top:3px}.annotation-reply-admin button{display:inline-block!important;border:0!important;background:none!important;color:#666!important;text-decoration:underline;cursor:pointer;font-size:12px;padding:2px 0!important}.annotation-reply{display:flex;gap:5px;margin-top:8px}.annotation-reply input{min-width:0;flex:1;padding:5px;border:1px solid #ccc;border-radius:5px}.annotation-reply button,.annotation-delete{border:0;background:none;color:#666;text-decoration:underline;cursor:pointer;font-size:12px;padding:2px}</style>
<style>.annotation-card.is-collapsed{width:auto;max-width:170px;padding:4px 8px;border-radius:999px;box-shadow:0 2px 7px #0002}.annotation-card.is-collapsed .annotation-quote{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:145px}.annotation-card.is-collapsed>div:not(.annotation-quote),.annotation-card.is-collapsed .annotation-reply{display:none}.annotation-card:not(.is-collapsed) .annotation-quote{cursor:pointer;font-size:12px;margin-bottom:5px}.annotation-card:not(.is-collapsed) .annotation-quote::before{content:'💬 ';}.annotation-card.is-collapsed .annotation-selected{display:none}.annotation-card:not(.is-collapsed) .annotation-preview{display:none}.annotation-preview{color:#555}.annotation-selected{color:#777}</style>
<script>
document.querySelectorAll('.page-body > table.simple-table').forEach((table) => {
  const wrapper = document.createElement('div');
  wrapper.className = 'table-scroll';
  table.parentNode.insertBefore(wrapper, table);
  wrapper.appendChild(table);
});
</script>
<style id="annotation-mobile-behavior">
.annotation-card .annotation-quote::before {
  content: '💬 ' attr(data-reply-count) ' · ' !important;
}
@media (max-width: 720px) {
  .annotation-panel { pointer-events: none; }
  .annotation-card { pointer-events: auto; }
  .annotation-card.is-collapsed {
    width: 54px !important;
    max-width: 54px !important;
    min-height: 34px;
    padding: 5px 7px;
    opacity: .35;
    border-radius: 999px;
  }
  .annotation-card.is-collapsed .annotation-quote {
    width: 40px;
    max-width: 40px;
    font-size: 0;
    overflow: visible;
    text-align: center;
  }
  .annotation-card.is-collapsed .annotation-quote::before {
    content: '💬 ' attr(data-reply-count) !important;
    font-size: 14px;
    white-space: nowrap;
  }
  .annotation-card:not(.is-collapsed) {
    width: min(260px, calc(100vw - 28px));
    max-width: min(260px, calc(100vw - 28px));
    opacity: 1;
  }
}
</style>
<style>.revision-admin [data-revision-id]{cursor:pointer}.revision-admin [data-revision-id]:hover{outline:1px dashed #999;outline-offset:2px}</style>
</body>
